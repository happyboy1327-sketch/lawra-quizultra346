<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💡 법률 상식 퀴즈 💡</title>
<style>
:root{--primary-color:#007bff;--secondary-color:#6c757d;--success-color:#28a745;--danger-color:#dc3545;--warning-color:#ffc107;--font-color:#343a40;--background-color:#f8f9fa}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:var(--background-color);color:var(--font-color);line-height:1.6;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;min-height:100vh}.screen-container{width:100%;max-width:800px;background:white;padding:40px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.1);text-align:center;display:none}.screen-container.active{display:block}h1{color:var(--primary-color);margin-bottom:30px}.btn{display:block;width:100%;max-width:400px;margin:10px auto;padding:15px;font-size:1.1em;border:none;border-radius:8px;cursor:pointer;transition:all .2s;color:white;font-weight:bold}.btn-primary{background-color:var(--primary-color)}.btn-success{background-color:var(--success-color)}.btn-secondary{background-color:var(--secondary-color)}.btn:hover:not(:disabled){opacity:.9;transform:translateY(-2px)}.opacity-50{opacity:.5}.cursor-not-allowed{cursor:not-allowed}.hidden{display:none!important}#question-text{font-size:1.3em;font-weight:500;margin-bottom:20px;background-color:#f1f3f5;padding:20px;border-radius:8px;border-left:5px solid var(--primary-color);text-align:left}.option-button{display:block;width:100%;padding:15px;margin:10px 0;text-align:left;border:2px solid #ced4da;border-radius:8px;background-color:white;color:var(--font-color);font-size:1em;cursor:pointer;transition:all .2s}.option-button:hover:not([disabled]){background-color:#e9ecef;border-color:var(--primary-color);transform:translateX(5px)}.correct{background-color:#d4edda!important;border-color:var(--success-color)!important}.incorrect{background-color:#f8d7da!important;border-color:var(--danger-color)!important}#explanation-area{border-top:2px dashed var(--secondary-color);padding-top:20px;margin-top:25px;text-align:left}#feedback-message{font-size:1.2em;font-weight:bold;margin-bottom:15px;padding:10px;border-radius:5px;text-align:center}.feedback-correct{background-color:#d4edda;color:var(--success-color)}.feedback-incorrect{background-color:#f8d7da;color:var(--danger-color)}#explanation-content{white-space:pre-wrap;background-color:#fff3cd;padding:15px;border-radius:8px;border:1px solid var(--warning-color);color:#856404}.review-item{text-align:left;border:1px solid #dee2e6;border-radius:8px;padding:20px;margin-bottom:20px;background-color:#f8f9fa}
</style>
</head>
<body>

<div id="start-screen" class="screen-container active">
<h1>⚖️ 법률 상식 퀴즈</h1>
<p style="margin-bottom:30px;font-size:1.1em">매일 새로운 법률 상식을 퀴즈로 배워보세요.<br>한 세트당 5문제가 출제됩니다.</p>
<button id="newQuizSetBtnEl" class="btn btn-primary">✨ 새 퀴즈 세트 생성</button>
<button id="reviewBtnEl" class="btn btn-success" onclick="handleEnterReviewMode()">📚 지난 오답 복습하기</button>
</div>

<div id="quiz-screen" class="screen-container">
<div style="display:flex;justify-content:space-between;margin-bottom:20px;border-bottom:2px solid #e9ecef;padding-bottom:10px;">
<div>문제: <span id="current-quiz-index">0</span> / <span id="total-quiz-count">0</span></div>
<div id="timer" style="font-weight:bold;color:var(--danger-color);border:2px solid var(--danger-color);padding:5px 15px;border-radius:8px;">15s</div>
</div>
<div id="question-text"></div>
<div id="options-container"></div>
<div id="explanation-area" style="display:none;">
<div id="feedback-message"></div>
<h3>🔍 해설</h3>
<p id="explanation-content"></p>
</div>
<button id="next-button" class="btn btn-primary" style="display:none;">다음 문제</button>
</div>

<div id="result-screen" class="screen-container">
<h2>🎉 퀴즈 완료!</h2>
<p style="font-size:1.2em">총 정답: <strong id="final-correct-count"></strong> / <span id="final-total-count"></span></p>
<p style="font-size:1.3em;color:var(--primary-color)">점수: <strong id="final-score"></strong>점</p>
<button class="btn btn-success" onclick="handleEnterReviewMode()">📚 오답 노트 확인</button>
<button class="btn btn-secondary" onclick="location.reload()">🏠 처음으로 돌아가기</button>
</div>

<div id="review-screen" class="screen-container">
<h1>📚 오답 노트</h1>
<div id="review-list"></div>
<button class="btn btn-secondary" onclick="location.reload()">🏠 처음으로 돌아가기</button>
</div>

<script>
const QUIZ_API_URL = '/api/lawquizzes/new';
const STORAGE_KEY_QUIZZES = 'lawQuizzesData';
let allQuizzes = [];
let currentQuizIndex = 0;
let correctCount = 0;
let timerInterval = null;
let isAnswered = false;

const newQuizSetBtnEl = document.getElementById("newQuizSetBtnEl");

// 새 퀴즈 세트 생성 버튼 이벤트
newQuizSetBtnEl.addEventListener("click", async () => {
  newQuizSetBtnEl.disabled = true;
  newQuizSetBtnEl.classList.add("opacity-50", "cursor-not-allowed");
  newQuizSetBtnEl.textContent = "퀴즈 생성 중... (최대 60초)";
  
  try {
    const res = await fetch(QUIZ_API_URL, { method: "POST" });
    
    if (!res.ok) {
      let errMessage = `새 퀴즈 생성 실패 (Status: ${res.status})`;
      try {
        const err = await res.json();
        errMessage = err.message || err.error || errMessage;
      } catch (e) {}
      throw new Error(errMessage);
    }
    
    allQuizzes = await res.json();
    
    if (!allQuizzes || allQuizzes.length === 0) {
      throw new Error("퀴즈 데이터가 없습니다.");
    }
    
    // 초기화
    currentQuizIndex = 0;
    correctCount = 0;
    
    // 퀴즈 시작
    startQuizFlow();
    
  } catch (err) {
    console.error(err);
    alert(`새 퀴즈 세트 생성 중 오류 발생: ${err.message}`);
  } finally {
    newQuizSetBtnEl.disabled = false;
    newQuizSetBtnEl.classList.remove("opacity-50", "cursor-not-allowed");
    newQuizSetBtnEl.textContent = "✨ 새 퀴즈 세트 생성";
  }
});

// 퀴즈 시작
function startQuizFlow() {
  document.querySelectorAll('.screen-container').forEach(el => el.classList.remove('active'));
  document.getElementById('quiz-screen').classList.add('active');
  updateQuizUI();
}

function formatBold(text) {
  return text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

// 퀴즈 UI 업데이트
function updateQuizUI() {
  if (currentQuizIndex >= allQuizzes.length) {
    showResults();
    return;
  }
  
  isAnswered = false;
  document.getElementById('next-button').style.display = 'none';
  document.getElementById('explanation-area').style.display = 'none';
  
  const quiz = allQuizzes[currentQuizIndex];
  
  document.getElementById('current-quiz-index').textContent = currentQuizIndex + 1;
  document.getElementById('total-quiz-count').textContent = allQuizzes.length;
  document.getElementById('question-text').innerHTML = 
  `<span style="color: var(--secondary-color); font-size: 0.9em;">(${quiz.category})</span><br>${formatBold(quiz.question)}`;
  
  const container = document.getElementById('options-container');
  container.innerHTML = '';
  
  quiz.options.forEach((option, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-button';
    btn.textContent = `${idx + 1}. ${option.text}`;
    btn.dataset.isCorrect = option.is_correct;
    btn.onclick = () => checkAnswer(btn, quiz);
    container.appendChild(btn);
  });
  
  startTimer(quiz.timer_sec || 15);
}

// 답안 체크
function checkAnswer(selectedBtn, quiz) {
  if (isAnswered) return;
  
  isAnswered = true;
  clearInterval(timerInterval);
  
  const isTimeUp = !selectedBtn;
  const isCorrect = isTimeUp ? false : selectedBtn.dataset.isCorrect === 'true';
  
  // 퀴즈 결과 저장
  quiz.is_correct_answered = isCorrect;
  quiz.user_answer_text = isTimeUp ? "⏰ 시간 초과" : selectedBtn.textContent;
  
  const feedbackEl = document.getElementById('feedback-message');
  
  if (isCorrect) {
    correctCount++;
    feedbackEl.textContent = "✅ 정답입니다!";
    feedbackEl.className = 'feedback-correct';
  } else {
    feedbackEl.textContent = isTimeUp ? "⏰ 시간 초과!" : "❌ 오답입니다.";
    feedbackEl.className = 'feedback-incorrect';
    if (selectedBtn) selectedBtn.classList.add('incorrect');
  }
  
  // 모든 버튼 비활성화 및 정답 표시
  document.querySelectorAll('.option-button').forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.isCorrect === 'true') {
      btn.classList.add('correct');
    }
  });
  
  // 해설 표시
  document.getElementById('explanation-content').innerHTML = formatBold(quiz.explanation);
  document.getElementById('explanation-area').style.display = 'block';
  
  // 다음 버튼 표시
  const nextBtn = document.getElementById('next-button');
  nextBtn.textContent = (currentQuizIndex < allQuizzes.length - 1) ? "다음 문제" : "결과 보기";
  nextBtn.style.display = 'block';
  nextBtn.onclick = () => {
    currentQuizIndex++;
    updateQuizUI();
  };
}

// 타이머 시작
function startTimer(seconds) {
  let left = seconds;
  document.getElementById('timer').textContent = `${left}s`;
  
  if (timerInterval) clearInterval(timerInterval);
  
  timerInterval = setInterval(() => {
    left--;
    document.getElementById('timer').textContent = `${left}s`;
    
    if (left <= 0) {
      clearInterval(timerInterval);
      if (!isAnswered) {
        checkAnswer(null, allQuizzes[currentQuizIndex]);
      }
    }
  }, 1000);
}

// 결과 화면 표시
function showResults() {
  document.getElementById('quiz-screen').classList.remove('active');
  document.getElementById('result-screen').classList.add('active');
  
  document.getElementById('final-correct-count').textContent = correctCount;
  document.getElementById('final-total-count').textContent = allQuizzes.length;
  document.getElementById('final-score').textContent = Math.round((correctCount / allQuizzes.length) * 100);
  
  // 오답만 localStorage에 저장
  saveWrongAnswers();
}

// 오답 저장
function saveWrongAnswers() {
  const stored = JSON.parse(localStorage.getItem(STORAGE_KEY_QUIZZES) || '[]');
  const wrongAnswers = allQuizzes.filter(q => q.is_correct_answered === false);
  
  // 중복 제거 (같은 문제는 덮어쓰기)
  const questionMap = new Map();
  stored.forEach(q => questionMap.set(q.question, q));
  wrongAnswers.forEach(q => questionMap.set(q.question, q));
  
  const updated = Array.from(questionMap.values());
  localStorage.setItem(STORAGE_KEY_QUIZZES, JSON.stringify(updated));
  
  console.log(`오답 ${wrongAnswers.length}개 저장됨 (누적: ${updated.length}개)`);
}

// 오답 노트 보기
function handleEnterReviewMode() {
  const stored = JSON.parse(localStorage.getItem(STORAGE_KEY_QUIZZES) || '[]');
  
  document.querySelectorAll('.screen-container').forEach(el => el.classList.remove('active'));
  document.getElementById('review-screen').classList.add('active');
  
  const list = document.getElementById('review-list');
  list.innerHTML = '';
  
  const wrongs = stored.filter(q => q.is_correct_answered === false);
  
  if (wrongs.length === 0) {
    list.innerHTML = "<div style='padding:20px;font-size:1.2em;color:var(--success-color)'>🎉 틀린 문제가 없습니다!</div>";
    return;
  }
  
  wrongs.forEach((q, idx) => {
    const correctOption = q.options.find(o => o.is_correct);
    const correctText = correctOption ? correctOption.text : "-";
    const div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML = `
  <h3 style="color:var(--primary-color)">${idx + 1}. ${formatBold(q.question)}</h3>
  <p style="color:#6c757d;font-size:0.9em;margin:5px 0 15px">
    🕒 ${q.id ? new Date(Number(q.id.replace('quiz-', ''))).toLocaleString('ko-KR') : '저장 일시 정보 없음'}
  </p>
  <p style='color:var(--danger-color);font-weight:bold'>❌ 내 답: ${q.user_answer_text || '-'}</p>
  <p style='color:var(--success-color);font-weight:bold'>✅ 정답: ${correctText}</p>
  <div style='background-color:#fff3cd;padding:10px;border-radius:5px;margin-top:10px'>
    <strong>📝 해설:</strong><br>${q.explanation}
  </div>
`;
    list.appendChild(div);
  });
}
</script>
</body>
</html>
