name: Mistral 파인튜닝 실행

on:
  workflow_dispatch:
    inputs:
      dataset_path:
        description: "저장소 안 승인 문제 JSON 파일 경로 (예: examples.json)"
        required: true
        default: "examples.json"
        type: string

permissions:
  contents: read

jobs:
  fine-tune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: API 키 확인
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -z "$MISTRAL_API_KEY" ]; then
            echo "::error::GitHub 저장소 Settings > Secrets and variables > Actions 에 MISTRAL_API_KEY 시크릿을 추가하세요."
            exit 1
          fi

      - name: 학습 데이터 검증 및 생성
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          test -f "${{ inputs.dataset_path }}" || {
            echo "::error::데이터 파일을 찾을 수 없습니다: ${{ inputs.dataset_path }}"
            echo "저장소에 JSON 데이터 파일을 먼저 올려주세요."
            exit 1
          }
          node mistral-finetune.mjs prepare "${{ inputs.dataset_path }}" training.jsonl validation.jsonl

      - name: Mistral 파인튜닝 작업 생성
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node mistral-finetune.mjs train training.jsonl validation.jsonl
